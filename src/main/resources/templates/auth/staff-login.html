<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Staff Login — Secure Bank</title>
    <link rel="stylesheet" th:href="@{/css/atm.css}">
    <style>
        body { background: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Segoe UI', sans-serif; }
        .login-card { background: white; border-radius: 16px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); }
        .login-header { text-align: center; margin-bottom: 32px; }
        .login-header h4 { color: #0f172a; font-size: 1.3rem; font-weight: 700; margin: 0; }
        .login-header p { color: #64748b; font-size: 0.85rem; margin: 4px 0 0; }
        .form-label { color: #374151; font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 6px; }
        .form-input { width: 100%; padding: 10px 14px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 0.9rem; color: #0f172a; box-sizing: border-box; transition: border-color 0.2s; }
        .form-input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        .form-group { margin-bottom: 20px; }
        .btn-login { background: linear-gradient(135deg, #1d4ed8, #2563eb); color: white; border: none; border-radius: 8px; padding: 12px; width: 100%; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; letter-spacing: 0.5px; }
        .btn-login:hover { background: linear-gradient(135deg, #1e40af, #1d4ed8); box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
        .alert-error { background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: 12px 16px; color: #991b1b; font-size: 0.85rem; margin-bottom: 20px; }
        .alert-success { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 12px 16px; color: #166534; font-size: 0.85rem; margin-bottom: 20px; }
        .divider { border: none; border-top: 1px solid #f1f5f9; margin: 24px 0; }
        .back-link { text-align: center; }
        .back-link a { color: #64748b; font-size: 0.8rem; text-decoration: none; }
        .back-link a:hover { color: #3b82f6; }
        .role-badge { display: inline-block; background: #eff6ff; color: #1d4ed8; font-size: 0.7rem; padding: 2px 8px; border-radius: 20px; letter-spacing: 1px; margin-top: 6px; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="login-header">
        <div style="font-size: 2rem; margin-bottom: 8px;">🏦</div>
        <h4>Secure Bank — Staff Portal</h4>
        <p>Bank Manager &amp; System Administrator Access</p>
        <span class="role-badge">STAFF ONLY</span>
    </div>

    <div th:if="${error}" class="alert-error" th:text="${error}"></div>
    <div th:if="${message}" class="alert-success" th:text="${message}"></div>

    <form th:action="@{/staff/login}" method="post">
        <div class="form-group">
            <label class="form-label">Staff ID / Username</label>
            <input type="text" name="username" class="form-input"
                   placeholder="e.g. MGR001 or ADM001"
                   autocomplete="username" required>
        </div>
        <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-input"
                   placeholder="Enter your password"
                   autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-login">Sign In →</button>
    </form>

    <hr class="divider">
    <div class="back-link">
        <a href="/atm/insert-card">← Back to ATM</a>
    </div>
</div>
</body>
</html>
