<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ATM — Transfer Funds</title>
    <link rel="stylesheet" th:href="@{/css/atm.css}">
</head>
<body class="atm-body">
<div class="atm-machine">
    <div class="atm-header">
        <div class="bank-name">🏦 Secure Bank</div>
        <div class="atm-label">Fund Transfer</div>
    </div>

    <div class="atm-screen">
        <div class="screen-title">Transfer Funds</div>

        <div th:if="${error}" class="alert-atm" th:text="${error}"></div>

        <div class="info-row" style="margin-bottom:16px;">
            <span>From Account</span>
            <span class="value" th:text="${account.accountNumber}"></span>
        </div>
        <div class="info-row" style="margin-bottom:16px;">
            <span>Available Balance</span>
            <span class="value" style="color:#00e676;"
                  th:text="'$' + ${#numbers.formatDecimal(account.balance, 1, 2)}"></span>
        </div>

        <form th:action="@{/atm/session/transfer}" method="post">
            <div style="margin-bottom:14px;">
                <label class="atm-label">Target Account Number</label>
                <input type="text" name="targetAccount" class="atm-input"
                       placeholder="e.g. ACC002" required autocomplete="off">
            </div>
            <div style="margin-bottom:14px;">
                <label class="atm-label">Amount</label>
                <input type="number" name="amount" class="atm-input"
                       placeholder="0.00" min="1" max="50000" step="0.01" required>
            </div>
            <div style="color:#484f58; font-size:0.72rem; margin-bottom:14px;">
                ⚠ Transfers above $5,000 require Bank Manager approval
            </div>
            <button type="submit" class="btn-atm-primary">TRANSFER →</button>
        </form>
        <div style="margin-top:10px;">
            <a href="/atm/session/dashboard"
               style="display:block; text-align:center; padding:10px; text-decoration:none; color:#8b949e; border:1px solid #30363d; border-radius:8px;">
                ← Back to Menu
            </a>
        </div>
    </div>

    <div class="atm-footer">
        <a href="/atm/session/dashboard">← Menu</a>
        <a href="/atm/logout">Logout</a>
    </div>
</div>
</body>
</html>
