spring.application.name=ATM Management System

# H2 file-based database (persists between restarts)
spring.datasource.url=jdbc:h2:file:./data/atmdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 console (accessible at /h2-console for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Session timeout (10 minutes idle)
server.servlet.session.timeout=10m

# ATM business rules (externalized for easy adjustment)
atm.transaction.large-threshold=5000.0
atm.pin.max-attempts=3

# Port
server.port=8080
